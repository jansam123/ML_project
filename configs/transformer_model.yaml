data:
  path: /home/scur0034/ML_project/data/JetClass/Pythia/train_100M

  batch_size: 512
  num_workers: 4

  max_particles_in_jet: 128

  chunk_size: 32768
  samples_per_file: 4056

  split:
    train: 0.7
    val: 0.15
    test: 0.15

  seed: 42


model:
  name: ParticleTransformer

  particle_dim: 9
  jet_feature_dim: 9

  hidden_dim: 256


training:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 200
  seed: 42

  scheduler:
    name: cosine
    min_lr: 0.00001

  # checkpointing
  monitor: val_loss
  monitor_mode: min