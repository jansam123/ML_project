data:
  path: /home/scur0034/ML_project/data/JetClass/Pythia/train_100M

  batch_size: 512
  num_workers: 8
  max_particles_in_jet: 128
  chunk_size: 32768
  samples_per_file: 2028

  split:
    train: 0.7
    val: 0.15
    test: 0.15

  seed: 42


model:
  name: ParticleTransformer

  # input dims
  particle_dim: 9
  jet_feature_dim: 9

  # core architecture
  hidden_dim: 128
  num_heads: 8
  num_layers: 2

  # NEW: regularization (reviewer requested dropout)
  dropout: 0.1

  # NEW: pooling choice (mean or max as requested)
  pooling_type: mean

  # optional future scaling
  transformer_dim: 128

  use_jet_features: false
  use_transformer: true


training:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 70
  seed: 42

  scheduler:
    name: cosine
    min_lr: 0.00001

  # checkpointing
  monitor: val_loss
  monitor_mode: min