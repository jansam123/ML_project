data:
  path: /home/scur0034/ML_project/data/JetClass/Pythia/train_100M
  batch_size: 512
  num_workers: 4
  max_particles_in_jet: 128
  chunk_size: 32768
  samples_per_file: 512
  split:
    train: 0.7
    val: 0.15
    test: 0.15
  seed: 42

model:
  name: "particle_transformer"
  num_particle_features: 9
  num_jet_features: 9
  num_classes: 4
  hidden_dim: 256
  dropout: 0.2

  use_jet_features: false
  use_transformer: true

  num_heads: 4
  num_transformer_layers: 2
  transformer_dim: 512




training:
  lr: 0.001
  epochs: 70
  optimizer: adam
  seed: 42